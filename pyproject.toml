[project]
name = "sshconf"
authors = [
    {name = "Søren A D", email = "soren@hamisoke.com"},
]
dependencies = []
license = {file = "LICENSE"}
dynamic = ["version", "description"]
classifiers = [
	'License :: OSI Approved :: MIT License',
	'Programming Language :: Python :: 3',
	'Topic :: Software Development :: Libraries :: Python Modules',
	'Topic :: Software Development :: Libraries',
]
requires-python = ">=3.5"
readme = "README.md"
keywords = [
	'ssh', 'config'
]

[project.urls]
homepage = "https://github.com/sorend/sshconf"

[project.optional-dependencies]
test = [
  "tox",
  "tox-gh-actions",
]

[build-system]
requires = ["setuptools", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["sshconf"]

[tool.setuptools.dynamic]
description = {file = "README.md"}

[tool.setuptools_scm]
write_to = "sshconf_version.py"
fallback_version = "0.0.0"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "*.*.*"]

[tool.pytest.ini_options]
addopts = "-v --cov-fail-under=60 --cov=sshconf"

[dependency-groups]
dev = [
    "pytest>=6.1.2",
    "pytest-cov>=2.12.1",
]
