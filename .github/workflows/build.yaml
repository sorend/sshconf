name: CI_CD

on:
  push:
  pull_request:

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{ github.ref_type }}-
    ${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  USERNAME: ${{ secrets.USERNAME }}
  PASSWORD: ${{ secrets.PASSWORD }}
  INDEX_URL: ${{ secrets.INDEX_URL }}

jobs:
  test:
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        platform: ["ubuntu-latest"]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Run tests
        run: |
          make test

  deploy:
    runs-on: "ubuntu-latest"
    needs: test
    strategy:
      matrix:
        platform: ["ubuntu-latest"]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Build
        run: |
          make build

      - name: Publish testpypi
        run: |
          make publish

      - name: Publish pypi
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        run: |
          export INDEX_URL=${{ secrets.PROD_INDEX_URL }}
          export USERNAME=${{ secrets.PROD_USERNAME }}
          export PASSWORD=${{ secrets.PROD_PASSWORD }}
          make publish
